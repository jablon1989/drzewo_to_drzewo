name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS plan role
  pull-requests: write # post the terraform plan as a comment

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.16.6

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform plan
    runs-on: ubuntu-latest
    env:
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive terraform

      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/envs/prod
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Validate
        working-directory: terraform/envs/prod
        run: terraform validate

      - name: Plan
        id: plan
        working-directory: terraform/envs/prod
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false | tee plan.txt

      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/envs/prod/plan.txt';
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Plan output missing.';
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['See details'])[0];
            if (plan.length > 60000) plan = '…(truncated)…\n' + plan.slice(-60000);
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n### Terraform plan (prod): ${{ steps.plan.outcome }}\n**${summary}**\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
